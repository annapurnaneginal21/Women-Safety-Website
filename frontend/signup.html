<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - Women Safety</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(270deg, #667eea, #764ba2, #6a11cb);
      background-size: 600% 600%;
      animation: gradientMove 10s ease infinite;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    @keyframes gradientMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .card {
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
    }

    input {
      background: rgba(255,255,255,0.2) !important;
      color: white !important;
      border: none !important;
    }

    input::placeholder {
      color: #ddd;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 10px #00c853;
    }

    .btn-success {
      background: #00c853;
      border: none;
    }

    .btn-success:hover {
      background: #00b248;
      box-shadow: 0 0 10px #00c853;
    }

    a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="width: 350px;">
      
      <h3 class="text-center mb-3">📝 Signup</h3>

      <input id="name" class="form-control mb-2" placeholder="Enter Name">
      <input id="email" class="form-control mb-2" placeholder="Enter Email">
      <input id="password" type="password" class="form-control mb-3" placeholder="Enter Password">

      <button class="btn btn-success w-100" onclick="signup()">Signup</button>

      <p class="text-center mt-3 small">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </div>

  <script>
    function signup() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      // 🔴 validation
      if (!name || !email || !password) {
        alert("Please fill all fields ❗");
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || [];

      // 🔴 duplicate check
      const exists = users.find(u => u.email === email);
      if (exists) {
        alert("User already exists ❌");
        return;
      }

      // ✅ save user
      users.push({ name, email, password });
      localStorage.setItem("users", JSON.stringify(users));

      alert("Signup Successful ✅");

      // redirect to login
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
