<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Women Safety App</title>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(270deg, #667eea, #764ba2, #6a11cb);
      background-size: 600% 600%;
      animation: gradientMove 10s ease infinite;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    @keyframes gradientMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .card {
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(255,255,255,0.4);
    }

    input {
      background: rgba(255,255,255,0.2) !important;
      color: white !important;
      border: none !important;
    }

    input::placeholder {
      color: #ddd;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 10px #00c853;
    }

    .btn-success {
      background: #00c853;
      border: none;
    }

    .btn-success:hover {
      background: #00b248;
      box-shadow: 0 0 10px #00c853;
    }

    .btn-danger {
      background: #ff3b3b;
      border: none;
      font-weight: bold;
    }

    .btn-danger:hover {
      background: red;
      box-shadow: 0 0 10px red;
    }

    .list-group-item {
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 10px;
      margin-bottom: 8px;
      color: black;
    }
  </style>
</head>

<body>

  <!-- 🔐 LOGIN PROTECTION -->
  <script>
    if (!localStorage.getItem("isLoggedIn")) {
      window.location.href = "login.html";
    }
  </script>

  <!-- 🚪 LOGOUT BUTTON -->
  <button onclick="logout()" class="btn btn-light btn-sm"
    style="position:absolute; top:20px; left:20px;">
    Logout
  </button>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 360px;">
      
      <h3 class="text-center mb-1 fw-bold">🚨 Women Safety</h3>

      <!-- 👇 Welcome user -->
      <h6 id="welcomeUser" class="text-center mb-2"></h6>

      <p class="text-center small">Stay Safe. Send SOS Instantly.</p>

      <input id="name" class="form-control mb-2" placeholder="Enter Name">
      <input id="phone" class="form-control mb-2" placeholder="Enter Phone">

      <button class="btn btn-success w-100 mb-3" onclick="saveContact()">Add Contact</button>

      <h5 class="mt-2">Contacts</h5>
      <ul id="contactList" class="list-group mb-3"></ul>

      <button class="btn btn-danger w-100" onclick="sendSOS()">🚨 SEND SOS ALERT</button>
      <a href="sos.html" class="btn btn-warning w-100 mt-2">
  📜 View SOS History
</a>

    </div>
  </div>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
