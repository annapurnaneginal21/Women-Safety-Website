<!DOCTYPE html>
<html>
<head>
  <title>SOS History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#222; color:white;">

<div class="container mt-4">
  <h2>🚨 SOS History</h2>

  <ul id="sosList" class="list-group mt-3"></ul>

  <a href="index.html" class="btn btn-light mt-3">Back</a>
</div>

<script>
fetch("http://localhost:5000/sos/history")
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById("sosList");

    data.forEach(s => {
      const li = document.createElement("li");

      li.className = "list-group-item";

      li.innerHTML = `
        <b>${s.name}</b> (${s.phone})<br>
        <a href="${s.location}" target="_blank">📍 View Location</a><br>
        <small>${new Date(s.time).toLocaleString()}</small>
      `;

      list.appendChild(li);
    });
  });
</script>

</body>
</html>
